name: Docs review provider benchmark
run-name: Docs review benchmark on PR #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  copilot-requests: write
  discussions: write
  issues: write
  pull-requests: write

jobs:
  copilot:
    name: Native Copilot
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/provider-benchmark')
    uses: elastic/docs-actions/.github/workflows/gh-aw-docs-review.lock.yml@cd443a815c893c682545ff68cf9be77032776ca9
    with:
      review-scope: docs-subtree
      additional-instructions: |
        This is a controlled provider benchmark. Review the triggering pull request normally and apply the complete review rubric without reducing depth.
    secrets: inherit

  litellm:
    name: LiteLLM
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/provider-benchmark')
    uses: elastic/docs-actions/.github/workflows/gh-aw-docs-review.lock.yml@36b83d2c5d78223ba55e403864d5bc0203c077c4
    with:
      review-scope: docs-subtree
      additional-instructions: |
        This is a controlled provider benchmark. Review the triggering pull request normally and apply the complete review rubric without reducing depth.
    secrets:
      DOCS_LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
